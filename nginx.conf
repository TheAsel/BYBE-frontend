load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
worker_cpu_affinity auto;

events {}

pid /tmp/nginx.pid;

http {
    include mime.types;
    types {
        application/manifest+json webmanifest;
    }

    sendfile on;
    tcp_nopush on;

    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types $brotli_types;

    server {
        listen       3000;
        listen  [::]:3000;
        server_name  bybe.app;
        root /usr/share/nginx/html;
        index index.html;
        access_log off;
        error_log  /tmp/nginx-error.log error;

        location = /index.html {
            internal;
            charset utf-8;
            add_header Cache-Control "no-cache";
            include nginx_headers.conf;
        }

        location ~* \.(?:xml|webmanifest)$ {
            charset utf-8;
            add_header Cache-Control "max-age=3600, public";
            include nginx_headers.conf;
        }

        location ~* \.(?:css|js)$ {
            charset utf-8;
            add_header Cache-Control "max-age=31536000, public, immutable";
            include nginx_headers.conf;
        }

        location ~* \.(?:svg|woff2|png|webp|ico)$ {
            add_header Cache-Control "max-age=31536000, public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location / {
            try_files $uri /index.html;
            include nginx_headers.conf;
        }

        location = /robots.txt  {
            access_log off;
            log_not_found off;
        }

        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
