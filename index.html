<!doctype html>
<html lang="en">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="bybe, pathfinder, 2e, second edition, pf 2e, pf2e, beyond your bestiary explorer, encounter builder, random, combat, generator, dm tools, gm tools, shop, npc"
    />

    <!-- Facebook meta tags -->
    <meta property="og:url" content="https://bybe.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BYBE - Pathfinder 2e and Starfinder 2e GM Tools" />
    <meta
      property="og:description"
      content="Beyond Your Bestiary Explorer (BYBE) is a one-stop shop for the most useful tools for Pathfinder 2e and Starfinder 2e GMs"
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/TheAsel/BYBE-frontend/HEAD/.github/social_preview.png"
    />

    <!-- Twitter meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="twitter:domain" content="bybe.app" />
    <meta property="twitter:url" content="https://bybe.app/" />
    <meta name="twitter:title" content="BYBE - Pathfinder 2e and Starfinder 2e GM Tools" />
    <meta
      name="twitter:description"
      content="Beyond Your Bestiary Explorer (BYBE) is a one-stop shop for the most useful tools for Pathfinder 2e and Starfinder 2e GMs"
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/TheAsel/BYBE-frontend/HEAD/.github/social_preview.png"
    />

    <!-- Other meta tags -->
    <meta name="robots" content="index, follow" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="language" content="English" />
    <meta name="author" content="TheAsel" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta name="google-site-verification" content="qtv93-j8tUOTtsuxOS988l9RF9L4-KGMgRYmOrUpQ5k" />

    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/imgs/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/imgs/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/imgs/icons/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/imgs/icons/safari-pinned-tab.svg" color="#5bbad5" />
    <meta name="msapplication-TileColor" content="#2d89ef" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
