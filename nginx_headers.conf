# /etc/nginx/nginx_headers.conf
set $DEFAULT "default-src 'self'";
set $CONNECT "connect-src 'self' https://*.bybe.app https://api.github.com https://storage.ko-fi.com";
set $SCRIPT "script-src 'self' 'unsafe-inline' https://storage.ko-fi.com";
set $STYLE "style-src 'self' 'unsafe-inline' https://storage.ko-fi.com https://fonts.googleapis.com";
set $FONT "font-src 'self' data: https://fonts.gstatic.com";
set $IMG "img-src 'self' data: https://storage.ko-fi.com";
set $FRAME "frame-src https://ko-fi.com";
set $OBJECT "object-src 'none'";

add_header Content-Security-Policy "${DEFAULT}; ${CONNECT}; ${SCRIPT}; ${STYLE}; ${FONT}; ${IMG}; ${FRAME}; ${OBJECT};" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin";
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload";
